<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpsLens Pulse</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <h1>🖥️ OpsLens Pulse</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search hosts..." />
    <select id="tagFilter">
      <option value="">All Tags</option>
    </select>
    <button id="logoutBtn">Logout</button>
  </div>

  <table id="hosts">
    <thead>
      <tr>
        <th>Host</th>
        <th>CPU</th>
        <th>Memory</th>
        <th>Tags</th>
        <th>Status</th>
        <th>Last Seen</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="/hosts.js"></script>
</body>
</html>
