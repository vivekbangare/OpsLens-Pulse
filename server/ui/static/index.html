<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpsLens Pulse</title>

  <!-- correct static path -->
  <link rel="stylesheet" href="/styles.css" />

  <style>
    #login {
      margin-bottom: 20px;
    }
    #login input {
      padding: 6px;
    }
    #login button {
      padding: 6px 10px;
    }
    #error {
      color: red;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<h1>🖥️ OpsLens Pulse</h1>

<div id="login">
  <input type="password" id="tokenInput" placeholder="Enter access token" />
  <button onclick="login()">Login</button>
  <div id="error"></div>
</div>

<table id="hosts" style="display:none">
  <thead>
    <tr>
      <th>Host</th>
      <th>CPU</th>
      <th>Memory</th>
      <th>Status</th>
      <th>Last Seen</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- correct static path -->
<script src="/script.js"></script>
</body>
</html>
