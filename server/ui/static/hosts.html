<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpsLens Pulse</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <header class="topbar">
    <h1>🖥️ OpsLens Pulse</h1>
    <small id="apiKeyInfo"></small>
  </header>

  <!-- HOST LIST -->
  <table id="hostsTable">
    <thead>
      <tr>
        <th>Host</th>
        <th>Status</th>
        <th>Last Seen</th>
        <th>IP</th>
        <th>OS</th>
        <th>Tags</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- HOST DETAILS -->
  <div id="hostDetails" style="display:none">
    <button id="backBtn" class="back-btn">⬅ Back</button>

    <h2 id="detailsHostname"></h2>

    <div class="panel grid-3">
      <div>
        <label>Status</label>
        <div id="detailsStatus"></div>
      </div>
      <div>
        <label>CPU</label>
        <div class="bar">
          <div id="cpuBar" class="bar-fill"></div>
        </div>
        <span id="detailsCPU"></span>%
      </div>
      <div>
        <label>Memory</label>
        <div class="bar">
          <div id="memBar" class="bar-fill mem"></div>
        </div>
        <span id="detailsMem"></span> MB
      </div>
    </div>

    <div class="panel">
      <label>Uptime</label>
      <div id="detailsUptime"></div>
      <label>Tags</label>
      <div id="detailsTags"></div>
    </div>

    <div class="panel">
      <h3>📜 Host Logs</h3>
      <div id="hostLogs" class="log-box"></div>
    </div>

    <div class="panel">
      <h3>🐳 Containers</h3>
      <table id="containersTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Image</th>
            <th>Status</th>
            <th>CPU</th>
            <th>Memory</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="/static/hosts.js"></script>
</body>
</html>
