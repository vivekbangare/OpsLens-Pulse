agent:
  interval_seconds: 5
  self_upgrade: false
  log_collection_interval_seconds: 5
  logs:
    - name: random_app_log
      type: file
      path: /logs/random.log
    - name: system_logs
      type: directory
      path: /var/log
      include:
        - syslog
        - auth.log
      exclude:
        - "*.gz"
    - name: kernel_logs
      type: command
      command: |
        echo "$(date '+%Y-%m-%d %H:%M:%S') INFO Command log test message AGENT2"
        echo "$(date '+%Y-%m-%d %H:%M:%S') WARN Command warning test AGENT2"
        echo "$(date '+%Y-%m-%d %H:%M:%S') ERROR Command error occurred AGENT2"
        echo "$(date '+%Y-%m-%d %H:%M:%S') CRITICAL System meltdown detected AGENT2"
  
tags:
  env: test
  region: us-west-2
  role: go-agent
  name: agent-config2
