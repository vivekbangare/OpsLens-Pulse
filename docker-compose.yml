services:
  server:
    image: golang:1.22
    working_dir: /app
    volumes:
      - .:/app
    command: go run server/main.go
    environment:
      SERVER_TOKEN: mysecrettoken 
    ports:
      - "9898:9898"
  agent:
    image: golang:1.22
    working_dir: /app
    volumes:
      - .:/app
    command: go run agent/main.go   
    environment:
      SERVER_URL: http://server:9898
      SERVER_TOKEN: mysecrettoken 
    depends_on:
      - server  